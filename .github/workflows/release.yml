# Builds the Windows exe and the Mac app, then publishes a GitHub Release with both
# whenever APP_VERSION in rotation_tracker.py changes on main. The app checks these
# releases for updates. Pushes to other branches build and test without releasing.
name: Build and release

on:
  push:
    branches: [main, "build-*"]
    paths: [rotation_tracker.py, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"', open('rotation_tracker.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Test branch: build only"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists - bump APP_VERSION to publish a new one."
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --onefile --windowed --name RotationTracker rotation_tracker.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/RotationTracker.exe

  mac:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --windowed --onedir --name RotationTracker \
            --osx-bundle-identifier io.github.xion0014.rotationtracker rotation_tracker.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.check.outputs.version }}" \
            dist/RotationTracker.app/Contents/Info.plist
          codesign --force --deep --sign - dist/RotationTracker.app
          file dist/RotationTracker.app/Contents/MacOS/RotationTracker
      - name: Smoke test (open the app and take a screenshot)
        run: |
          dist/RotationTracker.app/Contents/MacOS/RotationTracker examples/puppet_arcto.txt &
          APP=$!
          sleep 12
          screencapture -x mac-screenshot.png || true
          if kill -0 $APP 2>/dev/null; then echo "App is running"; kill $APP; else echo "App exited early"; exit 1; fi
      - name: Zip app
        run: ditto -c -k --keepParent dist/RotationTracker.app RotationTracker-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: RotationTracker-mac.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshot
          path: mac-screenshot.png

  release:
    needs: [check, windows, mac]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.check.outputs.version }}"
          gh release create "v$VER" out/windows/RotationTracker.exe out/mac/RotationTracker-mac.zip \
            --title "Rotation Tracker v$VER" \
            --notes "$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):')"
