# Builds RotationTracker.exe and publishes a GitHub Release whenever APP_VERSION
# in rotation_tracker.py changes. The app checks these releases for updates.
name: Build and release

on:
  push:
    branches: [main]
    paths: [rotation_tracker.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION\s*=\s*\"([^\"]+)\"', open('rotation_tracker.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VER already exists - bump APP_VERSION to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build exe
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --onefile --windowed --name RotationTracker rotation_tracker.py

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          gh release create "v$VER" dist/RotationTracker.exe \
            --title "Rotation Tracker v$VER" \
            --notes "$(git log -1 --pretty=%B)"
        env:
          GH_TOKEN: ${{ github.token }}
